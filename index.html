*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#1c4155;background:var(--bg);min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:18px;padding:12px 16px;background:var(--dark);color:white;font-weight:750}button.secondary{background:var(--soft);color:var(--dark)}button.ghost{background:#ffffffb5;color:var(--dark)}button.danger{background:#b84d6e}button:disabled{opacity:.45}header{display:flex;align-items:center;gap:10px;padding:16px 18px;background:#ffffff7d;backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffffbd}header h1{font-size:19px;margin:0;flex:1;text-align:center;letter-spacing:1px}header .back{padding:7px 12px}.wrap{max-width:700px;margin:auto;padding:20px 17px 48px}.panel{background:#ffffffc9;border:1px solid #fff;border-radius:23px;padding:19px;margin-bottom:16px;box-shadow:0 5px 20px #517b9815}.hero{text-align:center;padding:20px 12px 10px;background:transparent;border:0;box-shadow:none;margin:0}.mascot{display:none}.hero h2{font-size:26px;margin:4px 0 5px;color:var(--dark);letter-spacing:2px}.sub{color:#577b8b;font-size:13px}.hero .sub{margin:3px 0}.homebtn{width:100%;display:flex;align-items:center;gap:20px;text-align:left;margin:13px 0;padding:19px 22px;font-size:20px;box-shadow:0 6px 12px #305c7724;min-height:82px}.homebtn.alt{background:var(--mid)}.homebtn .btnicon{width:45px;height:45px;flex-shrink:0}.homebtn small{font-size:12px;font-weight:500;display:block;margin-top:5px}.home-art{height:140px;background:var(--art-bottom) center bottom / contain no-repeat;margin-top:18px}.decor{position:absolute;opacity:.22;pointer-events:none;font-size:22px}.home-layout{position:relative;min-height:calc(100dvh - 130px)}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row>*{min-width:0}.space{justify-content:space-between}.grow{flex:1}h2{font-size:20px}h3{font-size:16px}.folder{display:flex;align-items:center;gap:8px;padding:11px;border:1px solid #ffffffa6;background:#ffffff9c;border-radius:15px;min-height:91px;flex-wrap:wrap}.folder .title{flex:1 1 75%;text-align:center;background:none;color:var(--dark);padding:4px;font-weight:750}.count{font-size:12px;color:#647c89}.foldergrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:13px;padding:9px 11px;border-radius:11px}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#ffffffb8;color:var(--dark)}.choice.active{background:var(--dark);color:white}.preview{width:100%;height:270px;object-fit:contain;background:#e6eff0;border-radius:16px}.scanbox{text-align:center;padding:12px 0}.scanicon{font-size:70px;margin:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{position:relative;background:#e7f1f2;border-radius:12px;overflow:hidden}.tile img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.tile input{position:absolute;top:8px;left:8px;transform:scale(1.4)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:9px}.compare img{width:100%;height:245px;object-fit:contain;background:#e9f0f0;border-radius:12px}.compare label{font-size:12px;display:block;text-align:center;margin-bottom:6px}.thumbs{display:flex;gap:9px;overflow-x:auto;padding:12px 0}.thumbs img{height:74px;width:65px;object-fit:cover;border-radius:8px;border:3px solid transparent;cursor:pointer}.thumbs img.active{border-color:var(--mid)}.notice{padding:20px;text-align:center;font-weight:700}.muted{color:#637582;font-size:13px}input[type=text],select{padding:11px;border:1px solid #b8d3d1;border-radius:12px;background:white;width:100%;color:#142c3d}dialog{border:0;border-radius:22px;max-width:90vw;width:390px;padding:24px}dialog::backdrop{background:#0c243e88}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:13px 20px;border-radius:16px;z-index:30;max-width:90vw;text-align:center}#picker,#camera{display:none}.settingsgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.theme{padding:13px;background:#ffffffbd;color:var(--dark);border:2px solid transparent}.theme.active{border-color:var(--dark)}.theme img{height:67px;max-width:100%;object-fit:contain;display:block;margin:auto}.badge{background:#eaf6f4;padding:7px 10px;border-radius:10px}.hidden{display:none!important}@media(max-width:380px){.compare img{height:190px}.grid{grid-template-columns:repeat(2,1fr)}.home-art{height:120px}}
</style></head><body><header><button id="back" class="ghost back hidden">‹ 返回</button><h1 id="heading">收藏掃描</h1><button id="settings" class="ghost small">⚙️</button></header><main id="app" class="wrap"></main><input type="file" id="picker" accept="image/*" multiple><input type="file" id="camera" accept="image/*" capture="environment"><dialog id="dialog"><div id="dialogBody"></div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="secondary" id="cancel">取消</button><button id="confirm">確定</button></div></dialog><div id="toast" class="toast hidden"></div><script>
const $=s=>document.querySelector(s), app=$('#app');let db,screen='home',nav=[],scanCat=null,scanSub=null,addCat=null,addSub=null,queryImage=null,matches=[],matchIdx=0,selected=new Set();const palettes={sloth:['#265073','#2d9596','#9ad0c2','#ecf4d6','🦥'],owl:['#176b70','#2b9b94','#a2d9c7','#e9faf1','🦉'],fox:['#67568c','#9580bf','#c9b9e6','#f5efff','🦊'],penguin:['#a7507b','#d17ba4','#f1b8d0','#fff0f7','🐧']};let theme='sloth';try{theme=localStorage.theme||'sloth'}catch(e){}function applyTheme(){let p=palettes[theme];document.documentElement.style.cssText=`--dark:${p[0]};--mid:${p[1]};--soft:${p[2]};--pale:${p[3]};--bg:linear-gradient(155deg,#ffffff 0%,${p[3]} 22%,${p[2]} 100%);--art-top:url(${theme}-top.webp);--art-bottom:url(${theme}-bottom.webp)`;try{localStorage.theme=theme}catch(e){}}applyTheme();
const openDB=()=>new Promise((ok,no)=>{let r=indexedDB.open('collection-scan-v1',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('cats',{keyPath:'id'});d.createObjectStore('subs',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});const uid=()=>typeof crypto.randomUUID==='function'?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);function all(store){return new Promise((ok,no)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function put(store,obj){return new Promise((ok,no)=>{let r=db.transaction(store,'readwrite').objectStore(store).put(obj);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}function del(store,id){return new Promise((ok,no)=>{let r=db.transaction(store,'readwrite').objectStore(store).delete(id);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}let cats=[],subs=[],photos=[];async function refresh(){[cats,subs,photos]=await Promise.all(['cats','subs','photos'].map(all));render()}function toast(msg,ms=2000){let t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),ms)}function ask(html,onYes,yes='確定'){ $('#dialogBody').innerHTML=html;$('#confirm').textContent=yes;$('#confirm').className=yes.includes('刪除')?'danger':'';$('#dialog').showModal();$('#cancel').onclick=()=>$('#dialog').close();$('#confirm').onclick=async()=>{await onYes();$('#dialog').close()}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function goto(s){nav.push(screen);screen=s;render()}function back(){screen=nav.pop()||'home';render()}$('#back').onclick=back;$('#settings').onclick=()=>goto('settings');function count(cat,sub){return photos.filter(p=>(!cat||p.cat===cat)&&(!sub||p.sub===sub)).length}function sortedCats(){return [...cats].sort((a,b)=>count(b.id)-count(a.id)||a.name.localeCompare(b.name))}function sortedSubs(cat){return subs.filter(s=>s.cat===cat).sort((a,b)=>count(cat,b.id)-count(cat,a.id)||a.name.localeCompare(b.name))}function label(cat,sub){return (cats.find(c=>c.id===cat)?.name||'全部資料庫')+(sub?' / '+(subs.find(s=>s.id===sub)?.name||''):'')}
function render(){ $('#heading').textContent={home:'收藏掃描',scanSelect:'選擇掃描資料庫',scan:'拍照掃描',result:'圖片比對',manage:'增加資料庫',subManage:'選擇分類',gallery:'圖片資料庫',settings:'外觀與備份'}[screen]||'收藏掃描';$('#back').classList.toggle('hidden',screen==='home');$('#settings').classList.toggle('hidden',screen==='settings');let h='';if(screen==='home'){h=`<div class="home-layout"><section class="hero"><h2>收藏圖庫 ♥</h2><p class="sub">拍照比對・避免重複購買</p><p class="sub">只屬於我的收藏庫</p></section><div class="decor" style="left:0;top:45px">✿</div><div class="decor" style="right:6px;top:130px">✿</div><button class="homebtn" onclick="goto('scanSelect')"><svg class="btnicon" viewBox="0 0 48 48" fill="none" stroke="white" stroke-width="2.5"><path d="M6 14h9l4-5h12l4 5h7v26H6z"/><circle cx="24" cy="27" r="9"/></svg><span>掃描<small>拍照比對是否已收藏</small></span></button><button class="homebtn alt" onclick="goto('manage')"><svg class="btnicon" viewBox="0 0 48 48" fill="none" stroke="white" stroke-width="2.5"><rect x="6" y="7" width="36" height="34" rx="3"/><circle cx="16" cy="17" r="3"/><path d="m8 36 11-12 7 7 6-8 9 12"/></svg><span>增加資料庫<small>上傳或拍照新增收藏</small></span></button><div class="home-art" role="img" aria-label="主題動物插畫"></div><p class="sub" style="text-align:center">已收藏 ${photos.length} 張圖片 · ${cats.length} 個主要分類</p></div>`}
if(screen==='scanSelect'){h=`<section class="panel"><h2>選擇搜尋範圍</h2><button class="choice" onclick="chooseScan(null,null)">🔍 全部資料庫　<span class="count">${photos.length} 張</span></button>${sortedCats().map(c=>`<button class="choice" onclick="chooseScan('${c.id}',null)">📁 ${esc(c.name)}　<span class="count">${count(c.id)} 張</span></button>${sortedSubs(c.id).map(s=>`<button class="choice" style="margin-left:15px;width:calc(100% - 15px);background:#ffffffc9" onclick="chooseScan('${c.id}','${s.id}')">↳ ${esc(s.name)}　<span class="count">${count(c.id,s.id)} 張</span></button>`).join('')}`).join('')}</section>`}
if(screen==='scan'){h=`<section class="panel"><button class="choice" onclick="goto('scanSelect')">📂 目前資料庫：${esc(label(scanCat,scanSub))}　⌄</button><div class="scanbox"><div class="scanicon">📷</div><h2>準備掃描</h2><p class="sub">對準同人本或資料夾封面拍照</p><button style="font-size:19px;padding:17px 38px" onclick="startScan()">📸 拍照比對</button></div></section>`}
if(screen==='result'){let m=matches[matchIdx];h=`<section class="panel"><div class="row space"><h2>找到 ${matches.length} 張相似圖片</h2><button class="secondary small" onclick="closeResult()">✕ 關閉</button></div><div class="compare"><div><label>本次拍攝</label><img src="${queryImage}" onclick="zoom(this.src)"></div><div><label>收藏庫 (${matchIdx+1}/${matches.length})</label><img id="matched" src="${m?.data||''}" onclick="zoom(this.src)"></div></div><p class="muted" style="text-align:right">${m?esc(label(m.cat,m.sub)):''}</p><div class="row space"><button class="secondary small" onclick="changeMatch(-1)">‹ 上一張</button><button class="secondary small" onclick="changeMatch(1)">下一張 ›</button></div><div class="thumbs">${matches.map((p,i)=>`<img class="${i===matchIdx?'active':''}" src="${p.data}" onclick="matchIdx=${i};render()">`).join('')}</div><p class="sub">也可以在右側大圖左右滑動切換，點擊照片可放大。</p></section>`;setTimeout(()=>{let e=$('#matched');if(e){let x;e.ontouchstart=v=>x=v.touches[0].clientX;e.ontouchend=v=>{if(Math.abs(v.changedTouches[0].clientX-x)>35)changeMatch(v.changedTouches[0].clientX<x?1:-1)}}},0)}
if(screen==='manage'){h=`<section class="panel"><div class="row space"><h2>商品類型</h2><button class="small" onclick="newFolder('cat')">＋ 新增</button></div><p class="sub">依照片數量自動排序，點擊分類進入下一層。</p><div class="foldergrid">${sortedCats().map(c=>`<div class="folder"><span>📁</span><button class="title" onclick="addCat='${c.id}';goto('subManage')">${esc(c.name)} <span class="count">(${count(c.id)} 張)</span></button><button class="ghost small" onclick="renameFolder('cat','${c.id}')">✎</button><button class="danger small" onclick="removeFolder('cat','${c.id}')">刪除</button></div>`).join('')||'<p class="sub">尚無分類，請先新增。</p>'}</div></section>`}
if(screen==='subManage'){let c=cats.find(c=>c.id===addCat);h=`<section class="panel"><div class="row space"><h2>${esc(c?.name||'分類')}</h2><button class="small" onclick="newFolder('sub')">＋ 新增</button></div><p class="sub">選擇作品或 CP 分類，進入後即可上傳圖片。</p><div class="foldergrid">${sortedSubs(addCat).map(s=>`<div class="folder"><span>📂</span><button class="title" onclick="addSub='${s.id}';goto('gallery')">${esc(s.name)} <span class="count">(${count(addCat,s.id)} 張)</span></button><button class="ghost small" onclick="renameFolder('sub','${s.id}')">✎</button><button class="danger small" onclick="removeFolder('sub','${s.id}')">刪除</button></div>`).join('')||'<p class="sub">尚無子分類，請新增。</p>'}</div></section>`}
if(screen==='gallery'){let ps=photos.filter(p=>p.cat===addCat&&p.sub===addSub);h=`<section class="panel"><h2>${esc(label(addCat,addSub))}</h2><p class="sub">${ps.length} 張照片 · 上傳後自動壓縮</p><div class="row"><button onclick="upload('picker')">🖼️ 批次上傳</button><button class="secondary" onclick="upload('camera')">📷 拍照上傳</button></div><p id="progress" class="sub"></p><div class="row" style="margin:18px 0"><button class="ghost small" onclick="toggleAll()">全選／取消</button><button class="ghost small" onclick="moveSelected()">移動選取</button><button class="danger small" onclick="deleteSelected()">刪除選取</button></div><div class="grid">${ps.map(p=>`<div class="tile"><img src="${p.data}" onclick="zoom(this.src)"><input aria-label="選取圖片" type="checkbox" ${selected.has(p.id)?'checked':''} onchange="toggleSelect('${p.id}',this.checked)"></div>`).join('')}</div></section>`}
if(screen==='settings'){h=`<section class="panel"><h2>🎨 動物主題</h2><div class="settingsgrid">${Object.entries(palettes).map(([key,p])=>`<button class="theme ${key===theme?'active':''}" onclick="theme='${key}';applyTheme();render()"><img src="${key}-top.webp" alt="主題插畫"><br>${{sloth:'樹懶・藍色',owl:'貓頭鷹・湖水綠',fox:'狐狸・淺紫',penguin:'企鵝・粉紅'}[key]}</button>`).join('')}</div></section><section class="panel"><h2>💾 備份資料庫</h2><p class="sub">匯出包含壓縮照片及分類的 JSON 備份檔。建議定期備份，避免刪除 App 時資料遺失。</p><div class="row"><button onclick="exportBackup()">匯出備份</button><button class="secondary" onclick="$('#backupFile').click()">匯入還原</button></div><input id="backupFile" type="file" accept="application/json,.json" class="hidden" onchange="importBackup(this.files[0])"></section><section class="panel"><p class="sub">照片只儲存在目前裝置的瀏覽器資料庫中，不會上傳到伺服器。瀏覽器清除網站資料可能導致遺失，請務必備份。</p></section>`}
app.innerHTML=h}
function chooseScan(cat,sub){scanCat=cat;scanSub=sub;goto('scan')}function startScan(){$('#camera').dataset.mode='scan';$('#camera').value='';$('#camera').click()}function upload(which){let e=$('#'+which);e.dataset.mode='add';e.value='';e.click()}$('#picker').onchange=handleFiles;$('#camera').onchange=handleFiles;
async function compress(file){let bitmap=await createImageBitmap(file);let scale=Math.min(1,768/Math.max(bitmap.width,bitmap.height));let w=Math.max(1,Math.round(bitmap.width*scale)),h=Math.max(1,Math.round(bitmap.height*scale));let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d');ctx.drawImage(bitmap,0,0,w,h);bitmap.close();let data=c.toDataURL('image/webp',.72);if(!data.startsWith('data:image/webp'))data=c.toDataURL('image/jpeg',.7);return data}
async function hashImage(data){let img=new Image();img.src=data;await img.decode();let c=document.createElement('canvas');c.width=9;c.height=8;let x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,9,8);let pix=x.getImageData(0,0,9,8).data;let g=[];for(let i=0;i<pix.length;i+=4)g.push(.299*pix[i]+.587*pix[i+1]+.114*pix[i+2]);let hash='';for(let y=0;y<8;y++)for(let col=0;col<8;col++)hash+=g[y*9+col]>g[y*9+col+1]?'1':'0';c.width=8;c.height=8;x.drawImage(img,0,0,8,8);let px=x.getImageData(0,0,8,8).data,hist=Array(24).fill(0);for(let i=0;i<px.length;i+=4)for(let ch=0;ch<3;ch++)hist[ch*8+Math.min(7,px[i+ch]>>5)]++;return {hash,hist}}
function similarity(a,b){let diff=0;for(let i=0;i<64;i++)if(a.hash[i]!==b.hash[i])diff++;let hs=1-diff/64;let intersection=0;for(let i=0;i<24;i++)intersection+=Math.min(a.hist[i],b.hist[i]);let color=intersection/(64*3);return .7*hs+.3*color}
async function handleFiles(e){let fs=[...e.target.files];if(!fs.length)return;let mode=e.target.dataset.mode;if(mode==='scan'){toast('正在搜尋相似圖片…',20000);try{queryImage=await compress(fs[0]);let feature=await hashImage(queryImage);let candidates=photos.filter(p=>(!scanCat||p.cat===scanCat)&&(!scanSub||p.sub===scanSub));let scored=candidates.map(p=>({...p,score:similarity(feature,p)})).sort((a,b)=>b.score-a.score);matches=scored.filter(p=>p.score>=.65).slice(0,30);if(matches.length){matchIdx=0;goto('result')}else{toast('沒有相似圖片',2000)}}catch(err){toast('搜尋失敗，請重新拍攝')}return}let success=0;toast(`正在加入 0／${fs.length} 張…`,30000);for(let i=0;i<fs.length;i++){try{let data=await compress(fs[i]),feature=await hashImage(data);await put('photos',{id:uid(),cat:addCat,sub:addSub,data,...feature});success++;toast(`正在加入 ${i+1}／${fs.length} 張…`,30000)}catch(err){console.warn(err)}}selected.clear();await refresh();toast(`已成功新增 ${success} 張照片`)}
function newFolder(type){ask(`<h3>新增${type==='cat'?'商品類型':'作品／CP 分類'}</h3><input id="folderName" type="text" placeholder="輸入分類名稱" maxlength="60">`,async()=>{let name=$('#folderName').value.trim();if(!name)return toast('請輸入名稱');await put(type==='cat'?'cats':'subs',{id:uid(),name,...(type==='sub'?{cat:addCat}:{})});await refresh()},'新增')}function renameFolder(type,id){let o=(type==='cat'?cats:subs).find(v=>v.id===id);ask(`<h3>重新命名</h3><input id="folderName" type="text" value="${esc(o.name)}" maxlength="60">`,async()=>{let name=$('#folderName').value.trim();if(!name)return toast('名稱不可空白');await put(type==='cat'?'cats':'subs',{...o,name});await refresh()},'儲存')}function removeFolder(type,id){let obj=(type==='cat'?cats:subs).find(v=>v.id===id);let affected=photos.filter(p=>type==='cat'?p.cat===id:p.sub===id);ask(`<h3>確定刪除「${esc(obj.name)}」嗎？</h3><p>將連同 ${affected.length} 張照片${type==='cat'?'及所有子分類':''}一起刪除。<strong>此操作無法復原。</strong></p>`,async()=>{for(let p of affected)await del('photos',p.id);if(type==='cat')for(let s of subs.filter(s=>s.cat===id))await del('subs',s.id);await del(type==='cat'?'cats':'subs',id);await refresh();toast('已刪除')},'確認刪除')}
function toggleSelect(id,checked){checked?selected.add(id):selected.delete(id)}function toggleAll(){let ps=photos.filter(p=>p.cat===addCat&&p.sub===addSub);if(ps.every(p=>selected.has(p.id)))ps.forEach(p=>selected.delete(p.id));else ps.forEach(p=>selected.add(p.id));render()}function deleteSelected(){if(!selected.size)return toast('請先選擇照片');ask(`<h3>刪除 ${selected.size} 張照片？</h3><p>刪除後無法復原。</p>`,async()=>{for(let id of selected)await del('photos',id);selected.clear();await refresh()},'確認刪除')}function moveSelected(){if(!selected.size)return toast('請先選擇照片');let options=subs.map(s=>`<option value="${s.id}">${esc(label(s.cat,s.id))}</option>`).join('');if(!options)return toast('沒有其他分類');ask(`<h3>移動 ${selected.size} 張照片</h3><select id="moveTarget">${options}</select>`,async()=>{let s=subs.find(s=>s.id===$('#moveTarget').value);for(let id of selected){let p=photos.find(p=>p.id===id);if(p)await put('photos',{...p,cat:s.cat,sub:s.id})}selected.clear();await refresh();toast('移動完成')},'移動')}
function changeMatch(n){matchIdx=(matchIdx+n+matches.length)%matches.length;render()}function closeResult(){queryImage=null;matches=[];screen='scan';nav.pop();render()}function zoom(src){let d=document.createElement('dialog');d.style.cssText='width:96vw;max-width:900px;padding:12px;background:white';d.innerHTML=`<div style="text-align:right"><button class="small" id="zclose">✕ 關閉</button></div><img style="width:100%;max-height:78vh;object-fit:contain" src="${src}">`;document.body.append(d);d.showModal();d.querySelector('#zclose').onclick=()=>{d.close();d.remove()};d.onclose=()=>d.remove()}
function exportBackup(){let data={version:1,created:new Date().toISOString(),cats,subs,photos};let blob=new Blob([JSON.stringify(data)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='收藏掃描備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importBackup(file){if(!file)return;try{let o=JSON.parse(await file.text());if(!Array.isArray(o.cats)||!Array.isArray(o.subs)||!Array.isArray(o.photos))throw Error('格式錯誤');ask(`<h3>匯入備份？</h3><p>將加入 ${o.photos.length} 張照片。相同 ID 的資料會覆蓋現有資料。</p>`,async()=>{for(let c of o.cats)await put('cats',c);for(let s of o.subs)await put('subs',s);for(let p of o.photos)await put('photos',p);await refresh();toast('備份匯入完成')},'確認匯入')}catch(err){toast('無法讀取備份檔')}}
render();if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});(async()=>{try{db=await openDB();await refresh()}catch(e){app.innerHTML='<section class="panel">無法開啟本機資料庫。請使用 Safari 或 Chrome，並確認未停用網站儲存功能。</section>'}})();
</script></body></html>
